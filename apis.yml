name: Biophero
description: >-
  BioPhero is a Danish agricultural biotechnology company that engineers microbes to
  produce synthetic insect pheromones via microbial fermentation, providing low-cost,
  bio-based pest control that disrupts insect mating cycles on major row crops without
  toxic insecticides. Founded as a spin-out from the Technical University of Denmark (DTU),
  BioPhero raised a DCVC Bio-led Series A (with FMC Ventures, Syngenta Group Ventures, and
  Novo Holdings) and was subsequently acquired by FMC Corporation. The company is a
  DCVC portfolio holding surfaced in the API Evangelist network; it operates as a research
  and product organization in synthetic biology and crop protection and publishes no public
  developer API, documentation, SDKs, or agent-facing surface.
